<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Offline</title>
  <link rel="stylesheet" href="/shared/lab.css">
</head>
<body>
  <div class="lab-header">
    <h1>You're offline</h1>
    <p>This page was precached by the service worker, so it can be shown when a navigation fails
      with no network. It is deliberately self-contained: no images from the network, no fonts, no
      analytics — a fallback page that needs the network is not a fallback page.</p>
  </div>

  <div class="controls">
    <button onclick="location.reload()">try again</button>
    <a href="./"><button>back to the lab</button></a>
  </div>

  <p class="readout" id="state">checking connection…</p>

  <script>
    const state = document.getElementById('state');
    const show = () => {
      state.textContent = navigator.onLine
        ? 'navigator.onLine says you are back online — but note that it only means "an interface ' +
          'is up". A captive portal or a dead uplink still reads as online, which is why you should ' +
          'test with a real request, not this flag.'
        : 'navigator.onLine says offline.';
    };
    addEventListener('online', show);
    addEventListener('offline', show);
    show();
  </script>
</body>
</html>

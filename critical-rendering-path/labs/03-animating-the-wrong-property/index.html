<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lab 03 — Animating the wrong property</title>
  <link rel="stylesheet" href="../../shared/lab.css">
  <style>
    #track { position: relative; height: 70vh; overflow: hidden; }
    .runner {
      position: absolute;
      left: 0;
      width: 60px;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, #7c9cff, #b57cff);
    }

    /* --- Strategy: transformCss ------------------------------------------------
       TODO: define a composited keyframe animation here and toggle .css-transform
       from app.js. Keep the distance identical to the JS versions (0 → 300px). */
    .runner.css-transform { /* animation: ... */ }

    /* --- Strategy: leftCss -----------------------------------------------------
       Provided so you can prove that "CSS animation" does not mean "composited". */
    @keyframes slide-left { from { left: 0; } to { left: 300px; } }
    .runner.css-left { animation: slide-left 1.2s ease-in-out infinite alternate; }
  </style>
</head>
<body>
  <div class="lab-header">
    <h1>Lab 03 — Animating the wrong property</h1>
    <p>Same motion, four implementations. Turn on Paint flashing and Layer borders, then press
      <code>block main thread</code> and see which animations survive.</p>
  </div>

  <div class="controls">
    <label>runners <input id="count" type="number" value="200" min="1" max="4000" step="10"></label>
    <button id="rebuild">rebuild</button>
    <div class="sep"></div>
    <label>strategy
      <select id="strategy">
        <option value="leftJs">1 · left, via rAF (broken)</option>
        <option value="leftCss">2 · left, via CSS animation</option>
        <option value="marginLeft">3 · margin-left, via rAF</option>
        <option value="transformJs">4 · transform, via rAF</option>
        <option value="transformCss">5 · transform, via CSS</option>
        <option value="off">off</option>
      </select>
    </label>
    <div class="sep"></div>
    <button id="block" data-variant="bad">block main thread (2s)</button>
    <button id="flip">FLIP demo</button>
    <button id="reset">reset HUD</button>
  </div>

  <p class="readout" id="out"></p>

  <div id="track" class="stage"></div>

  <script src="../../shared/perf-hud.js"></script>
  <script src="app.js"></script>
</body>
</html>

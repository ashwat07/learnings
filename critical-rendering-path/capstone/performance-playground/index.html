<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Performance playground</title>
  <link rel="stylesheet" href="../../shared/lab.css">
  <style>
    #layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
    #nav { position: sticky; top: 20px; }
    #nav h3 { font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
              color: var(--muted); margin: 14px 0 6px; }
    #nav a { display: block; color: var(--text); text-decoration: none; font-size: 13px;
             padding: 4px 8px; border-radius: 6px; }
    #nav a:hover { background: #ffffff0d; }
    #nav a[aria-current="true"] { background: var(--accent); color: #0d0d12; }
    #nav .todo { color: var(--muted); opacity: .55; }
    #panel { display: grid; gap: 12px; min-width: 0; }
    #blurb { max-width: 720px; color: var(--muted); }
    #metric { font: 13px/1.7 ui-monospace, Menlo, monospace; }
    #metric b { color: var(--text); }
    #predict { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px;
               color: var(--muted); max-width: 720px; }
    #devtools-tip { border-left: 2px solid var(--accent); padding-left: 10px; color: var(--muted);
                    font-size: 12px; max-width: 720px; }
  </style>
</head>
<body>
  <div class="lab-header">
    <h1>Performance playground</h1>
    <p>Every demo has a broken mode and a fixed mode, and a number that changes between them.
      <strong>Throttle your CPU to 4× before believing anything on this page.</strong></p>
  </div>

  <div id="layout">
    <nav id="nav"></nav>

    <div id="panel">
      <div class="controls">
        <button id="mode-broken" data-variant="bad" aria-pressed="true">broken</button>
        <button id="mode-fixed" data-variant="good" aria-pressed="false">fixed</button>
        <div class="sep"></div>
        <button id="run">run / interact</button>
        <button id="reset">reset measurement</button>
        <span class="tag" id="stage-tag">—</span>
      </div>

      <p id="blurb">Pick a demo.</p>

      <div id="predict" hidden>
        <strong>Predict first:</strong> <span id="predict-text"></span>
        <button id="predict-reveal">reveal</button>
      </div>

      <p id="metric"></p>
      <p id="devtools-tip"></p>

      <div id="stage" class="stage"></div>
    </div>
  </div>

  <script src="../../shared/perf-hud.js"></script>
  <script type="module" src="playground.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nimbus 9 — product (your fix)</title>

  <!-- ========================================================================
       YOUR FIX GOES IN THIS FILE.

       Rules: every resource below must still load, with the same delay and the
       same size. The rendered result must look the same. You may add hints,
       change attributes, move tags, inline things, and change how the JS finds
       its data.

       The eight problems, in the order you will probably find them:

       TODO 1. A synchronous third-party script in the head blocks the parser for
               500ms, on an origin the browser has never connected to.
       TODO 2. The connection to localhost:8081 is opened only when it is needed.
       TODO 3. The LCP image is discovered by the stylesheet (600ms) and then
               takes 700ms itself — a 1.3s chain before it can paint.
       TODO 4. The hero element is marked lazy.
       TODO 5. The data request is 3 hops deep: HTML → module → import → fetch.
       TODO 6. The preload for the data does not match the request the app makes,
               and lacks crossorigin. Two downloads, one warning.
       TODO 7. The 12 thumbnails are invisible to the preload scanner and are
               fetched at the same priority as the hero.
       TODO 8. No width/height on the thumbnails, so the page shifts as they land.

       Target at Fast 4G: LCP < 1.5s, FCP < 1.0s, chain depth 1, CLS < 0.05,
       zero console warnings, zero duplicate downloads.
       ======================================================================== -->

  <script src="http://localhost:8081/api/script.js?name=tagmanager2&delay=500&size=120000"></script>

  <link rel="stylesheet" href="/shared/lab.css">

  <link rel="stylesheet"
        href="/api/style.css?name=product2&delay=600&img=%2Fapi%2Fimage.svg%3Fname%3Dproduct-hero2%26delay%3D700%26w%3D1000%26h%3D460%26size%3D250000%26label%3DNimbus%2B9">

  <style>
    #hero { height: 460px; background-size: cover; border-radius: 10px; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .thumbs img { width: 120px; border-radius: 6px; }
    .price { font-size: 26px; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="lab-header">
    <h1>Nimbus 9 <span class="tag">your fix</span></h1>
    <p>Same page, your discovery plan.</p>
  </div>

  <div id="hero" class="stage" loading="lazy"></div>

  <p class="price" id="price">loading price…</p>
  <p id="stock">loading stock…</p>

  <div class="thumbs" id="thumbs"></div>

  <link rel="preload" as="fetch" href="/api/asset?name=product-data2&type=json&delay=400">

  <script type="module">
    await import('/api/script.js?name=product-app2&delay=400&size=90000');
    const data = await fetch('/api/asset?name=product-data2&type=json&delay=400&fields=all')
      .then((r) => r.json());
    document.getElementById('price').textContent = `£249.00 — served ${data.servedAt}`;
    document.getElementById('stock').textContent = 'In stock';

    const box = document.getElementById('thumbs');
    for (let i = 0; i < 12; i++) {
      const img = document.createElement('img');
      img.src = `/api/image.svg?name=thumb2-${i}&delay=300&w=120&h=90&size=80000&label=${i}`;
      box.append(img);
    }
  </script>

  <script src="http://localhost:8081/api/script.js?name=analytics2&delay=300&size=200000" defer></script>

  <script src="/resource-hints/report.js"></script>
</body>
</html>
